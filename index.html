<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121815">
<meta name="description" content="Austin Boath, an urban planning student and video creator from Adelaide, South Australia.">
<title>Austin Boath</title>
<style>
:root{color-scheme:dark;--paper:#121815;--ink:#f4f0e5;--muted:#bdc6bd;--accent:#b0dfbc;--rule:#46564c}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}
.page{width:min(100% - 2 * clamp(1.25rem,7vw,7rem),82rem);margin:auto;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}
header,footer{padding-block:1.35rem;display:flex;align-items:center;gap:1rem}
header{border-bottom:1px solid var(--rule)}
.monogram{display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:50%;background:var(--accent);color:#13231a;font-family:Georgia,serif;font-size:1.07rem}
.location{color:var(--muted);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
main{align-self:center;padding-block:clamp(3.5rem,10vh,8rem)}
h1{font:400 clamp(3.75rem,12.4vw,11rem)/.89 Georgia,'Times New Roman',serif;letter-spacing:-.075em;margin:0 0 clamp(1.6rem,4vw,3rem)}
h1 span{font-style:italic}
p{max-width:36ch;font-size:clamp(1.05rem,2vw,1.32rem);line-height:1.55;margin:0 0 1.75rem;color:var(--muted);text-wrap:pretty}
.watch{display:inline-flex;align-items:center;gap:1.35rem;padding:.85rem 1.2rem;min-height:48px;background:var(--accent);color:#13231a;border-radius:3px;text-decoration:none;font-weight:600}
.watch:hover{background:#c9ecd1}
.watch:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
footer{border-top:1px solid var(--rule);color:var(--muted);font-size:.85rem}
@media(max-width:420px){h1 span{display:block}}
</style>
</head>
<body>
<div class="page">
<header><span class="monogram" aria-hidden="true">AB</span><span class="location">Adelaide, South Australia</span></header>
<main>
<h1>Austin <span>Boath</span></h1>
<p>I study urban planning and make videos about cities, roads and the places I travel to.</p>
<a class="watch" href="https://www.youtube.com/@Austin_Boath">Watch on YouTube <span aria-hidden="true">↗</span></a>
</main>
<footer>austinboath.com</footer>
</div>
</body>
</html>
